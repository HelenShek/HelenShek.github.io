  - title: Picture Composition Class Teaching Assistant System Based on the Multi-rounds Question and Answering Interaction
  # 基于多轮问答的儿童看图写话教学辅助系统
    role: Developer
    description: Designed to help young students practice picture-guided composition and reduce teachers' grading workload. This LLM-powered system supports multi-turn interactive guidance, optimized prompting and a modular scoring & classification mechanism.
    # 为了辅助低年级学生进行看图写话练习，并为教师减轻批改作文的工作量，本项目设计了一个基于大语言模型的多轮互动、引导提示优化以及模块化评分分类机制的儿童看图写话教学辅助系统。
    tech:
      - Spring Boot
      - MySQL
      - BERT
      - ResNet
      - PCSBTT
    accent: cyan
    type: Collaborative
  - title: Hazardous Materials Management System
  # 危险品管理系统
    role: Project Lead
    description: Implemented in C language, this system helps warehouse administrators and operators manage hazardous material inventory, usage and procurement to ensure safety and compliance. It includes modules for information entry, inventory query, usage logging and procurement record tracking.
    # 本项目设计了一款基于 C 语言开发的危险品管理系统，旨在帮助危险品仓库的管理人员及危险品使用者高效管理危险品的库存、使用和采购，确保安全合规。系统提供了危险品信息录入、库存查询、使用记录、采购记录等功能模块。
    tech:
      - C
    accent: cyan
    type: Collaborative