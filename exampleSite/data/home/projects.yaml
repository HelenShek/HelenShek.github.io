  - title: PTA Learning Analytics Report Plugin
    # title: PTA平台学情分析报告插件
    role: Project Author
    description: This project develops a PTA platform plugin based on multi-agent collaboration and static code analysis. It provides a real-time code diagnosis sidebar for students, ability profile reports for assignments, exams and whole semesters, as well as a class-wide learning dashboard for instructors. The system tracks the evolution of students' programming thinking and automatically generates teaching suggestions.
    # 本项目设计了一款基于多智能体协作与静态代码分析的 PTA 平台（程序设计类实验辅助教学平台）学情分析报告插件，包含学生端代码实时诊断侧边栏、单次练习/单次考试/整个学期能力画像报告，以及教师端班级学情全景看板、学生代码思维演进追踪及教学建议生成功能。
    tech:
      - Vue3
      - FastAPI
      - LangGraph
      - MySQL
      - Redis
