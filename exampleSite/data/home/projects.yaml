  - title: Campus Mutual Aid Platform
  # 校园互助平台
    role: Developer
    description: Built with Django under B/S architecture, this online community serves university students. It focuses on campus mutual assistance scenarios and integrates learning Q&A, information sharing, item exchange and real-time messaging functions.
    # 本项目设计了一款基于 Django 框架搭建的 B/S 架构校园线上社区系统，专为高校学生打造，聚焦校园互助场景，集学习答疑、资讯分享、物品交换、实时沟通等功能于一体。
    tech:
      - HTML/CSS
      - Django
      - SQLite
      - Redis
      - Celery
    accent: cyan
    type: Collaborative
  - title: Hanwen Zhijian — Ancient Chinese Character Recognition & Document Management System
  # 汉文智鉴——古汉字智能识别与文献管理系统
    role: Developer
    description: Targeting challenges in the preservation and research of ancient documents in Northwest China, this system adopts YOLOv8 to detect and recognize characters on thousands of local land deed images, overcoming limitations of manual identification. Integrated with document management modules, it supports fast keyword retrieval of image archives for efficient storage and access of ancient materials.
    # 本项目针对西北地区古文献保护与研究的难题，以 YOLOv8 模型为技术支撑，对数千张西北地区地契图片开展精准文字检测与识别，突破传统人工识别的局限。同时，系统融合文献管理功能，涵盖影像资料管理模块，用户可通过输入关键字，快速、准确地检索相关影像资料，实现对古文献的高效管理与便捷查阅。
    tech:
      - Flask
      - HTML/CSS/JavaScript
      - SQL Server
      - YOLOv8
      - DBSCAN
      - Canvas
    accent: cyan
    type: Collaborative
