summary: 我是一名计算机专业的学生，关注人工智能在实际场景中的应用。
details:
  - 我乐于探索用理论方法解决真实场景中的难题，并构建可靠、稳定、结构清晰的系统来验证我的想法。
  - 我的主要研究方向为可信人工智能与人工智能在安全领域的应用；同时对机器人、具身智能、人机交互、智能教育、网络安全等领域均有所涉猎。
  - 我参与开发多个软件项目，涵盖网页平台与插件、数据分析工具、AI辅助学习与检测系统。
